<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Administration du site — Bénédicte Donet</title>
    <style>
      :root {
        --cms-bg: #f8f4ef;
        --cms-panel: #fffdf9;
        --cms-border: #e7ddd4;
        --cms-text: #3f474f;
        --cms-muted: #6e756f;
        --cms-accent: #b98278;
      }

      body {
        background: var(--cms-bg);
        color: var(--cms-text);
      }

      [class*="AppMainContainer"],
      [class*="CollectionMain"],
      [class*="EditorContainer"] {
        background: var(--cms-bg);
      }

      [class*="SidebarContainer"] {
        background: #efe5dc;
        border-right: 1px solid var(--cms-border);
      }

      [class*="ControlContainer"],
      [class*="ObjectWidgetTop"],
      [class*="ListControl"] {
        border-color: var(--cms-border);
      }

      [class*="ObjectWidgetTop"],
      [class*="ListControl"] {
        background: var(--cms-panel);
        border-radius: 10px;
      }

      label,
      [class*="FieldLabel"] {
        color: var(--cms-text);
        font-weight: 700;
        letter-spacing: 0.02em;
      }

      input,
      textarea,
      select,
      [contenteditable="true"] {
        border-color: var(--cms-border) !important;
        border-radius: 8px !important;
        color: var(--cms-text) !important;
      }

      textarea,
      [contenteditable="true"] {
        line-height: 1.7 !important;
      }

      button {
        border-radius: 8px !important;
      }

      a,
      button,
      [role="button"] {
        transition:
          background-color 160ms ease,
          border-color 160ms ease,
          color 160ms ease,
          box-shadow 160ms ease;
      }
    </style>
  </head>
  <body>
    <script>
      // Decap conserve le choix de tri du navigateur et lui donne priorité sur config.yml.
      // v2 : après correction du format de date ISO, forcer à nouveau le tri chronologique.
      (() => {
        const migrationKey = "benedicte-cms-blog-sort-v2";
        const sortKey = "decap-cms.entries.sort";

        try {
          if (localStorage.getItem(migrationKey)) return;

          let sortState = {};
          const savedSort = localStorage.getItem(sortKey);
          if (savedSort) {
            const parsedSort = JSON.parse(savedSort);
            if (parsedSort && typeof parsedSort === "object" && !Array.isArray(parsedSort)) {
              sortState = parsedSort;
            }
          }

          sortState.blog = {
            date: { key: "date", direction: "Descending", index: 0 },
          };
          localStorage.setItem(sortKey, JSON.stringify(sortState));
          localStorage.setItem(migrationKey, "done");
        } catch (error) {
          console.warn("Impossible de réinitialiser le tri du blog.", error);
        }
      })();
    </script>
    <!-- Markdown → HTML pour la preview (images inline incluses) -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <!-- Version figée : default_sort est pris en charge à partir de Decap CMS 3.10 -->
    <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>
    <script src="/admin/preview.js?v=20260720b"></script>
    <script src="/admin/custom-widgets.js?v=20260720b"></script>
  </body>
</html>
